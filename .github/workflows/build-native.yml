name: Build Native (APK + IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  android:
    name: Android APKs (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Expo prebuild (Android)
        run: bunx expo prebuild --platform android --no-install

      - name: Enable ABI splits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          source = path.read_text()
          splits = """android {
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                      universalApk true
                  }
              }
          """
          path.write_text(source.replace("android {", splits, 1))
          print(path.read_text()[:1200])
          PY

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          OUT=android/app/build/outputs/apk/release
          ls -lh "$OUT"
          cp "$OUT/app-arm64-v8a-release.apk" artifacts/OctoCode-arm64-v8a.apk
          cp "$OUT/app-armeabi-v7a-release.apk" artifacts/OctoCode-armeabi-v7a.apk
          cp "$OUT/app-x86_64-release.apk" artifacts/OctoCode-x86_64.apk
          cp "$OUT/app-universal-release.apk" artifacts/OctoCode-universal.apk
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: OctoCode-apk
          path: artifacts/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Expo prebuild (iOS)
        run: bunx expo prebuild --platform ios --no-install

      - name: CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build app without code signing
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          mkdir -p artifacts/Payload
          cp -R "$APP" artifacts/Payload/
          cd artifacts
          zip -qry OctoCode-unsigned.ipa Payload
          ls -lh OctoCode-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OctoCode-ipa
          path: artifacts/OctoCode-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish on Releases (latest)
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.apk" -o -name "*.ipa" \) -exec cp {} dist/ \;
          ls -lh dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: OctoCode — builds mais recentes
          body: |
            Pacotes gerados automaticamente pelo workflow **Build Native**.

            | Pacote | Arquitetura | Uso |
            | --- | --- | --- |
            | `OctoCode-universal.apk` | todas | qualquer Android 7+ (~38 MB) |
            | `OctoCode-arm64-v8a.apk` | arm64 | celulares modernos (~26 MB) |
            | `OctoCode-armeabi-v7a.apk` | armv7 | celulares antigos (~24 MB) |
            | `OctoCode-x86_64.apk` | x86_64 | emuladores e Chromebooks (~27 MB) |
            | `OctoCode-unsigned.ipa` | arm64 | AltStore / SideStore (~40 MB) |

            O IPA não é assinado: instale via AltStore, SideStore ou assinatura própria.
          files: dist/*
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
