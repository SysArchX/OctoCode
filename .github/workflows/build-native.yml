name: Build Native + Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  android:
    name: Android APKs (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Enable ABI splits in build.gradle
        run: |
          cat > android/app/build.gradle << 'GRADLE_EOF'
          // ... (existing content above)
          android {
              // ... other android config

              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a", "armeabi-v7a", "x86_64"
                      universalApk true
                  }
              }
          }
          GRADLE_EOF

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          OUT=android/app/build/outputs/apk/release
          ls -lh "$OUT"

          # Collect split APKs
          cp "$OUT"/app-arm64-v8a-release.apk artifacts/OctoCode-arm64-v8a.apk 2>/dev/null || true
          cp "$OUT"/app-armeabi-v7a-release.apk artifacts/OctoCode-armeabi-v7a.apk 2>/dev/null || true
          cp "$OUT"/app-x86_64-release.apk artifacts/OctoCode-x86_64.apk 2>/dev/null || true

          # Collect universal APK
          if [ -f "$OUT/app-universal-release.apk" ]; then
            cp "$OUT/app-universal-release.apk" artifacts/OctoCode-universal.apk
          fi

          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        working-directory: ios
        run: pod install

      - name: Build app without code signing
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace=$WORKSPACE scheme=$SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"

          PayloadDir="$(pwd)/ios/build/Build/Products/Release-iphoneos"
          OLDPWD="$(pwd)"

          mkdir -p "$PayloadDir/Payload"
          mkdir -p "$OLDPWD/artifacts"

          cp -R "$APP" "$PayloadDir/Payload/"
          cd "$PayloadDir"
          zip -qry "$OLDPWD/artifacts/OctoCode-unsigned.ipa" Payload
          cd "$OLDPWD"

          ls -lh artifacts/OctoCode-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/OctoCode-unsigned.ipa
          if-no-files-found: error

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Copy PWA to website/app
        run: |
          mkdir -p website/app
          cp -r pwa-app/* website/app/
          ls -lh website/app

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publish on Releases (latest)
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    steps:
      - name: Create release directory
        run: mkdir -p release

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: release
        continue-on-error: true

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release
        continue-on-error: true

      - name: List release artifacts
        run: ls -lh release/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'latest'
          name: OctoCode — Latest Builds
          body: |
            Automatic builds generated by the **Build Native + Deploy GitHub Pages** workflow.

            | Package | Architecture | Usage |
            | --- | --- | --- |
            | `OctoCode-universal.apk` | All ABIs | Any Android 7+ (~38 MB) |
            | `OctoCode-arm64-v8a.apk` | ARM64 | Modern phones (~26 MB) |
            | `OctoCode-armeabi-v7a.apk` | ARMv7 | Older phones (~24 MB) |
            | `OctoCode-x86_64.apk` | x86_64 | Emulators / Chromebooks (~27 MB) |
            | `OctoCode-unsigned.ipa` | arm64 | AltStore / SideStore (~40 MB) |

            The IPA is unsigned: install via AltStore, SideStore, or your own signing.
          files: release/*
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
