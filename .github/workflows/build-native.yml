name: Build Native + Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"

# Trigger guard: ensure iOS builds use the app scheme, not a sub-lib scheme.

jobs:
  android:
    name: Android APKs (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Enable ABI splits in build.gradle
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          if "splits {" in content:
              print("splits block already exists, skipping...")
          else:
              lines = content.split('\n')
              new_lines = []
              android_depth = 0
              in_android = False
              inserted = False

              for i, line in enumerate(lines):
                  new_lines.append(line)

                  if re.match(r'\s*android\s*\{', line):
                      in_android = True
                      android_depth = 1
                  elif in_android:
                      android_depth += line.count('{') - line.count('}')

                      if android_depth == 0 and not inserted:
                          indent = len(line) - len(line.lstrip())
                          splits_block = '\n'.join([
                              ' ' * indent + 'splits {',
                              ' ' * indent + '    abi {',
                              ' ' * indent + '        enable true',
                              ' ' * indent + '        reset()',
                              ' ' * indent + '        include "arm64-v8a", "armeabi-v7a", "x86_64"',
                              ' ' * indent + '        universalApk true',
                              ' ' * indent + '    }',
                              ' ' * indent + '}',
                          ])
                          new_lines.insert(-1, splits_block)
                          inserted = True
                          print("Inserted splits block")

              path.write_text('\n'.join(new_lines))
              print("Updated build.gradle")
              print(path.read_text()[:2000])

          PY

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          OUT=android/app/build/outputs/apk/release
          ls -lh "$OUT"

          cp "$OUT"/app-arm64-v8a-release.apk artifacts/OctoCode-arm64-v8a.apk 2>/dev/null || true
          cp "$OUT"/app-armeabi-v7a-release.apk artifacts/OctoCode-armeabi-v7a.apk 2>/dev/null || true
          cp "$OUT"/app-x86_64-release.apk artifacts/OctoCode-x86_64.apk 2>/dev/null || true

          if [ -f "$OUT/app-universal-release.apk" ]; then
            cp "$OUT/app-universal-release.apk" artifacts/OctoCode-universal.apk
          fi

          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        working-directory: ios
        run: pod install

      - name: Build app without code signing
        working-directory: ios
        run: |
          set -x
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "workspace=$WORKSPACE"

          # Prefer the app scheme (OctoCode). Fall back to the first workspace scheme only if needed.
          if xcodebuild -list -workspace "$WORKSPACE" -json | python3 -c "
import json,sys
schemes = json.load(sys.stdin)['workspace']['schemes']
sys.exit(0 if 'OctoCode' in schemes else 1)
"; then
            SCHEME=OctoCode
          else
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          fi
          echo "scheme=$SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          # Accept either the app-name .app or any .app produced by the chosen scheme.
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print | head -n 1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "No .app found under build/Build/Products/Release-iphoneos after build"
            exit 1
          fi
          ls -ld "$APP"

      - name: Package unsigned IPA
        run: |
          set -x
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print | head -n 1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "No .app found under ios/build/Build/Products/Release-iphoneos"
            exit 1
          fi
          ls -ld "$APP"
          rm -rf ipa_tmp && mkdir -p ipa_tmp/Payload
          cp -R "$APP" ipa_tmp/Payload/
          (cd ipa_tmp && zip -qry ../OctoCode-unsigned.ipa Payload)
          if [ ! -f OctoCode-unsigned.ipa ]; then
            echo "OctoCode-unsigned.ipa was not created"
            exit 1
          fi
          ls -l OctoCode-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: OctoCode-unsigned.ipa
          if-no-files-found: error

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Export web app (PWA)
        run: npx expo export --platform web --output-dir website/app

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publish on Releases (latest)
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    steps:
      - name: Create release directory
        run: mkdir -p release

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: release
        continue-on-error: true

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release
        continue-on-error: true

      - name: List release artifacts
        run: ls -lh release/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'latest'
          name: OctoCode — Latest Builds
          body: |
            Automatic builds generated by the **Build Native + Deploy GitHub Pages** workflow.

            | Package | Platform | Notes |
            | --- | --- | --- |
            | `OctoCode-universal.apk` | Android | All architectures |
            | `OctoCode-arm64-v8a.apk` | Android | Modern phones |
            | `OctoCode-armeabi-v7a.apk` | Android | Older devices |
            | `OctoCode-x86_64.apk` | Android | Emulators / Chromebooks |
            | `OctoCode-unsigned.ipa` | iOS | AltStore / SideStore |

            The IPA is unsigned: install via AltStore, SideStore, or your own signing.
          files: release/*
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
// noop2
// trigger-c9a2
